    Pannello di gestione contenuti (Sveltia CMS).

    Perche' Sveltia e non Decap: Decap si appoggiava a Netlify Identity e Git
    Gateway, che Netlify ha deprecato, non corregge piu' e sconsiglia sui siti
    nuovi. Sveltia riusa la stessa configurazione (public/admin/config.yml) ma
    parla direttamente con GitHub, quindi non dipende da un pezzo abbandonato.

    Chi gestisce i contenuti entra con il proprio account GitHub e deve essere
    invitato come collaboratore del repository. Istruzioni in docs/HANDOFF.md.
  -->
