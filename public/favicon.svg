<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Stemma semplificato ASD Citta di Galati: cerchio bordato oro con le tre
       fasce verticali blu-giallo-rosso dello stemma originale (assets/logo-original.jpeg).
       A 16px lo stemma completo e' illeggibile: qui restano solo la sagoma tonda
       bordata e i tre colori, riconoscibili anche in miniatura. -->
  <defs>
    <clipPath id="mark-clip">
      <circle cx="16" cy="16" r="13" />
    </clipPath>
  </defs>
  <circle cx="16" cy="16" r="15" fill="#E1791B" />
  <g clip-path="url(#mark-clip)">
    <rect x="3" y="3" width="8.7" height="26" fill="#0032F4" />
    <rect x="11.7" y="3" width="8.7" height="26" fill="#F8EA21" />
    <rect x="20.3" y="3" width="8.7" height="26" fill="#F20016" />
  </g>
</svg>
