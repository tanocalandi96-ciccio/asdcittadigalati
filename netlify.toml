[build]
  command = "npm run build"
  publish = "dist"

# package.json richiede Node >= 22.12. Netlify usa una versione predefinita
# che puo' essere piu' vecchia: senza questa riga il primo build automatico
# fallisce, e la causa non e' evidente dal messaggio d'errore.
[build.environment]
  NODE_VERSION = "22"

# ANTEPRIMA: nessuna indicizzazione finche' i contenuti sono fittizi.
# Rimuovere questo blocco (e sistemare public/robots.txt) alla messa online.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# I frame dell'hero hanno nomi fissi (f-000.webp...), quindi "immutable" li
# congelerebbe nel browser anche dopo una rigenerazione: e' successo davvero il
# 27/07/2026, il sito continuava a servire i frame vecchi e un manifest scaduto.
# Finche' i contenuti cambiano si tiene una cache breve. Alla messa online, se
# si vuole la cache lunga, va versionata la cartella (es. /hero-frames/v2/).
[[headers]]
  for = "/hero-frames/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
